<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Architect | Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --p1: #6366f1; --p2: #8b5cf6; --p3: #ec4899;
  --success: #10b981; --error: #ef4444; --warn: #f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}

body {
  min-height:100vh;
  background: linear-gradient(-45deg, #ff6b6b, #ff8e53, #ff6fd8, #a855f7, #3b82f6, #06b6d4, #10b981, #f59e0b);
  background-size: 600% 600%;
  animation: gradShift 8s ease infinite;
  padding: 2rem;
}
@keyframes gradShift {
  0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
}
@keyframes fadeIn  {from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin    {to{transform:rotate(360deg)}}
@keyframes pulse   {0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideUp {from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Header ── */
.site-header{text-align:center;margin-bottom:2rem;animation:fadeDown .6s ease-out}
.site-header h1{
  font-family:'Outfit',sans-serif;font-size:3rem;font-weight:800;
  background: linear-gradient(90deg, #fff 0%, #fde68a 20%, #f9a8d4 40%, #a5f3fc 60%, #bbf7d0 80%, #fff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:none;letter-spacing:-1px;filter:drop-shadow(0 2px 12px rgba(255,255,255,.4));
}
.site-header h1 span{
  background:linear-gradient(90deg,#fff,#fde68a,#fff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.site-header p{color:rgba(255,255,255,.85);font-size:1.05rem;margin-top:.3rem}
.badge{
  display:inline-block;background:rgba(255,255,255,.25);backdrop-filter:blur(8px);
  color:#fff;font-size:.65rem;font-weight:700;padding:.2rem .7rem;border-radius:999px;
  letter-spacing:.1em;text-transform:uppercase;margin-left:.5rem;vertical-align:middle;
  border:1px solid rgba(255,255,255,.4);
}

/* ── Layout ── */
.container{
  max-width:1150px;margin:0 auto;
  display:grid;grid-template-columns:1fr 1.35fr;gap:1.75rem;
  animation:fadeIn .7s ease-out;
}

/* ── Glass Panel ── */
.panel{
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1.5px solid rgba(255,255,255,.5);
  border-radius:28px;padding:2rem;
  box-shadow:0 8px 32px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.4);
}
.panel:first-child{
  background: linear-gradient(135deg, rgba(168,85,247,.25), rgba(59,130,246,.2), rgba(236,72,153,.2));
  border-color: rgba(255,255,255,.45);
}
.panel.output-panel{
  background: linear-gradient(135deg, rgba(6,182,212,.2), rgba(16,185,129,.2), rgba(245,158,11,.15));
  border-color: rgba(255,255,255,.45);
}
.panel-title{
  font-family:'Outfit',sans-serif;font-size:1.15rem;font-weight:700;
  color:#fff;margin-bottom:1.4rem;
}

/* ── Form ── */
.form-group{margin-bottom:1rem}
label{
  display:flex;justify-content:space-between;align-items:center;
  font-size:.72rem;font-weight:600;color:rgba(255,255,255,.8);
  margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.07em;
}
.char-count{font-size:.68rem;color:rgba(255,255,255,.5)}
.char-count.warn{color:#fde68a}

input,textarea,select{
  width:100%;background:rgba(255,255,255,.18);
  border:1.5px solid rgba(255,255,255,.4);border-radius:14px;
  padding:.7rem 1rem;color:#fff;font-size:.9rem;
  transition:all .25s;outline:none;
}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.5)}
input:focus,textarea:focus,select:focus{
  border-color:#fde68a;
  background:rgba(255,255,255,.28);
  box-shadow:0 0 0 3px rgba(253,230,138,.3), 0 0 20px rgba(253,230,138,.15);
}
input.invalid,textarea.invalid{border-color:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.25)}
textarea{resize:vertical;min-height:78px}
select option{background:#4c1d95;color:#fff}

/* ── Pill selectors ── */
.pill-group{display:flex;gap:.5rem;flex-wrap:wrap}
.pill{
  flex:1;min-width:70px;padding:.45rem .7rem;border-radius:10px;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.7);font-size:.78rem;font-weight:600;
  cursor:pointer;text-align:center;transition:all .2s;
}
.pill:hover{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.6)}
.pill.active{
  background:rgba(255,255,255,.9);color:#6d28d9;
  border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.2);
}

/* ── Buttons ── */
.btn{
  border:none;padding:.85rem 1.25rem;border-radius:14px;
  font-weight:700;font-size:.95rem;cursor:pointer;
  transition:all .25s;display:flex;justify-content:center;align-items:center;gap:.5rem;
  width:100%;
}
.btn-primary{
  background:linear-gradient(135deg,#f9a8d4,#c084fc,#818cf8,#67e8f9);
  background-size:200% 200%;
  animation: gradShift 4s ease infinite;
  color:#fff;margin-top:1rem;
  box-shadow:0 6px 24px rgba(168,85,247,.5);
  text-shadow:0 1px 4px rgba(0,0,0,.2);
}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 32px rgba(168,85,247,.6)}
.btn-sm{
  background:rgba(255,255,255,.18);color:#fff;
  border:1px solid rgba(255,255,255,.3);
  font-size:.78rem;padding:.4rem .9rem;width:auto;
}
.btn-sm:hover{background:rgba(255,255,255,.28)}
.btn-sm.copied{background:rgba(16,185,129,.3);border-color:rgba(16,185,129,.6);color:#6ee7b7}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.loader{
  width:16px;height:16px;
  border:2px solid rgba(109,40,217,.3);border-top-color:#6d28d9;
  border-radius:50%;animation:spin .7s linear infinite;display:none;
}

/* ── Output panel ── */
.output-panel{display:flex;flex-direction:column;max-height:88vh}
.output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.output-actions{display:flex;gap:.5rem;flex-wrap:wrap}

#output{
  flex:1;overflow-y:auto;font-size:.875rem;line-height:1.8;
  color:#fff;padding-right:.4rem;
}
#output::-webkit-scrollbar{width:5px}
#output::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:10px}

/* ── Placeholder ── */
.placeholder-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:280px;color:rgba(255,255,255,.6);gap:.75rem;text-align:center;
}
.placeholder-icon{font-size:3.5rem;opacity:.5}

/* ── Skeleton ── */
.skeleton-line{
  height:13px;border-radius:6px;margin-bottom:9px;
  background:linear-gradient(90deg,rgba(255,255,255,.1) 25%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.1) 75%);
  background-size:200% 100%;animation:pulse 1.3s ease-in-out infinite;
}

/* ── Resume formats ── */

/* FORMAT: Classic */
.fmt-classic .r-name{font-size:1.6rem;font-weight:800;color:#fff;font-family:'Outfit',sans-serif}
.fmt-classic .r-role{color:rgba(255,255,255,.7);font-size:.9rem;margin-bottom:.8rem}
.fmt-classic .r-section{font-weight:700;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#fde68a;margin-top:1.1rem;margin-bottom:.2rem}
.fmt-classic .r-divider{border:none;border-top:1px solid rgba(255,255,255,.2);margin-bottom:.5rem}
.fmt-classic .r-bullet{padding-left:1rem;margin-bottom:.2rem}
.fmt-classic .r-line{margin-bottom:.2rem}

/* FORMAT: Modern Card */
.fmt-modern{background:rgba(255,255,255,.08);border-radius:16px;padding:1.25rem}
.fmt-modern .r-name{font-size:1.5rem;font-weight:800;color:#fff;font-family:'Outfit',sans-serif;background:linear-gradient(90deg,#fde68a,#f9a8d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.fmt-modern .r-role{color:rgba(255,255,255,.65);font-size:.88rem;margin-bottom:1rem}
.fmt-modern .r-section{display:inline-block;background:rgba(255,255,255,.15);border-radius:6px;padding:.15rem .6rem;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;margin-top:1rem;margin-bottom:.4rem}
.fmt-modern .r-divider{display:none}
.fmt-modern .r-bullet{padding-left:1rem;margin-bottom:.25rem;border-left:2px solid rgba(253,230,138,.5);padding-left:.75rem}
.fmt-modern .r-line{margin-bottom:.2rem}

/* FORMAT: Minimal */
.fmt-minimal .r-name{font-size:1.7rem;font-weight:300;color:#fff;letter-spacing:-.5px;font-family:'Outfit',sans-serif}
.fmt-minimal .r-role{color:rgba(255,255,255,.55);font-size:.85rem;margin-bottom:1rem;font-style:italic}
.fmt-minimal .r-section{font-weight:600;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:1.2rem;margin-bottom:.3rem}
.fmt-minimal .r-divider{border:none;border-top:1px solid rgba(255,255,255,.1);margin-bottom:.5rem}
.fmt-minimal .r-bullet{padding-left:1rem;margin-bottom:.2rem;color:rgba(255,255,255,.85)}
.fmt-minimal .r-line{margin-bottom:.2rem;color:rgba(255,255,255,.85)}

/* FORMAT: Bold */
.fmt-bold{background:rgba(0,0,0,.15);border-radius:16px;padding:1.25rem}
.fmt-bold .r-name{font-size:2rem;font-weight:900;color:#fff;font-family:'Outfit',sans-serif;text-transform:uppercase;letter-spacing:-1px}
.fmt-bold .r-role{color:#fde68a;font-size:.9rem;font-weight:600;margin-bottom:1rem;text-transform:uppercase;letter-spacing:.05em}
.fmt-bold .r-section{font-weight:900;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:#fde68a;margin-top:1.2rem;margin-bottom:.1rem}
.fmt-bold .r-divider{border:none;border-top:2px solid #fde68a;margin-bottom:.5rem;opacity:.4}
.fmt-bold .r-bullet{padding-left:1rem;margin-bottom:.25rem}
.fmt-bold .r-line{margin-bottom:.2rem}

/* ── ATS bar ── */
.ats-wrap{
  margin-top:1rem;padding:.9rem 1rem;
  background:rgba(255,255,255,.12);border-radius:14px;
  border:1px solid rgba(255,255,255,.2);animation:slideUp .4s ease-out;
}
.ats-label{display:flex;justify-content:space-between;font-size:.75rem;color:rgba(255,255,255,.7);margin-bottom:.45rem}
.ats-val{font-weight:700;color:#6ee7b7}
.ats-bar{height:6px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}
.ats-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#818cf8,#10b981);transition:width 1.1s ease}

/* ── Toast ── */
#toast{
  position:fixed;bottom:2rem;right:2rem;
  padding:.75rem 1.25rem;border-radius:14px;
  font-size:.85rem;font-weight:600;color:#fff;
  opacity:0;transform:translateY(10px);transition:all .3s;
  pointer-events:none;z-index:9999;max-width:300px;
  backdrop-filter:blur(12px);
}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{background:rgba(16,185,129,.85)}
#toast.error  {background:rgba(239,68,68,.85)}
#toast.info   {background:rgba(99,102,241,.85)}

/* ── Responsive ── */
@media(max-width:860px){
  .container{grid-template-columns:1fr}
  .output-panel{max-height:none}
  .site-header h1{font-size:2.2rem}
  body{padding:1rem}
}
</style>
</head>
<body>

<header class="site-header">
  <h1><span>Resume Architect</span> <span class="badge">Premium</span></h1>
  <p>AI-powered · ATS-optimized · Beautifully formatted</p>
</header>

<div class="container">

  <!-- INPUT PANEL -->
  <div class="panel">
    <p class="panel-title">✏️ Your Details</p>

    <div class="form-group">
      <label>Full Name <span class="char-count" id="nameCount">0/60</span></label>
      <input id="name" type="text" placeholder="John Doe" maxlength="60" oninput="cnt('name','nameCount',60)">
    </div>

    <div class="form-group">
      <label>Target Job Role <span class="char-count" id="roleCount">0/80</span></label>
      <input id="jobrole" type="text" placeholder="Senior Software Engineer" maxlength="80" oninput="cnt('jobrole','roleCount',80)">
    </div>

    <div class="form-group">
      <label>Key Skills <span class="char-count" id="skillCount">0/500</span></label>
      <textarea id="skills" placeholder="React, Node.js, Python, AWS..." maxlength="500" oninput="cnt('skills','skillCount',500)"></textarea>
    </div>

    <div class="form-group">
      <label>Work Experience <span class="char-count" id="expCount">0/1000</span></label>
      <textarea id="experience" placeholder="3 yrs at TechCorp as Lead Dev — built X, achieved Y..." maxlength="1000" style="min-height:90px" oninput="cnt('experience','expCount',1000)"></textarea>
    </div>

    <div class="form-group">
      <label>Education <span class="char-count" id="eduCount">0/200</span></label>
      <input id="education" type="text" placeholder="BS Computer Science, MIT, 2020" maxlength="200" oninput="cnt('education','eduCount',200)">
    </div>

    <div class="form-group">
      <label>Resume Tone</label>
      <div class="pill-group" id="toneGroup">
        <div class="pill active" data-val="professional" onclick="pick(this,'toneGroup')">Professional</div>
        <div class="pill" data-val="creative" onclick="pick(this,'toneGroup')">Creative</div>
        <div class="pill" data-val="executive" onclick="pick(this,'toneGroup')">Executive</div>
      </div>
    </div>

    <div class="form-group">
      <label>Resume Format</label>
      <div class="pill-group" id="fmtGroup">
        <div class="pill active" data-val="classic" onclick="pick(this,'fmtGroup');applyFormat()">Classic</div>
        <div class="pill" data-val="modern" onclick="pick(this,'fmtGroup');applyFormat()">Modern</div>
        <div class="pill" data-val="minimal" onclick="pick(this,'fmtGroup');applyFormat()">Minimal</div>
        <div class="pill" data-val="bold" onclick="pick(this,'fmtGroup');applyFormat()">Bold</div>
      </div>
    </div>

    <button class="btn btn-primary" id="genBtn" onclick="generate()">
      <div id="btnLoader" class="loader"></div>
      <span id="btnText">✨ Generate Resume</span>
    </button>
  </div>

  <!-- OUTPUT PANEL -->
  <div class="panel output-panel">
    <div class="output-header">
      <p class="panel-title" style="margin-bottom:0">📄 Preview</p>
      <div class="output-actions">
        <button class="btn btn-sm" id="improveBtn" onclick="improve()" disabled>🪄 Improve</button>
        <button class="btn btn-sm" id="copyBtn" onclick="copyText()" disabled>Copy</button>
        <button class="btn btn-sm" id="dlTxtBtn" onclick="downloadTxt()" disabled>📄 TXT</button>
        <button class="btn btn-sm" id="dlBtn" onclick="download()" disabled>⬇ PDF</button>
      </div>
    </div>

    <div id="output">
      <div class="placeholder-state">
        <div class="placeholder-icon">🚀</div>
        <p style="font-weight:600">Your resume will appear here</p>
        <p style="font-size:.82rem;opacity:.7">Fill in your details and hit Generate</p>
      </div>
    </div>

    <div id="atsWrap" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = "https://resume-architect-5xkc.onrender.com";
let resume = "";
let activeTone = "professional";
let activeFmt  = "classic";

// ── Pill picker ──────────────────────────────────────────────────────────────
function pick(el, groupId) {
  document.querySelectorAll(`#${groupId} .pill`).forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  if (groupId === "toneGroup") activeTone = el.dataset.val;
  if (groupId === "fmtGroup")  activeFmt  = el.dataset.val;
}

// ── Char counter ─────────────────────────────────────────────────────────────
function cnt(id, cid, max) {
  const l = document.getElementById(id).value.length;
  const el = document.getElementById(cid);
  el.textContent = `${l}/${max}`;
  el.classList.toggle("warn", l > max * .85);
}

// ── Toast ────────────────────────────────────────────────────────────────────
function toast(msg, type="info") {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = `show ${type}`;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = "", 3000);
}

// ── Skeleton ─────────────────────────────────────────────────────────────────
function skeleton() {
  const ws = ["55%","88%","72%","95%","60%","80%","50%","90%","65%","78%","45%","85%"];
  document.getElementById("output").innerHTML =
    ws.map(w => `<div class="skeleton-line" style="width:${w}"></div>`).join("");
}

// ── ATS score ────────────────────────────────────────────────────────────────
function atsScore(text) {
  let s = 58;
  ["experience","skills","education","summary","achieved","managed","led","developed",
   "increased","reduced","team","project","results","delivered","optimized"].forEach(k => {
    if (text.toLowerCase().includes(k)) s += 2.5;
  });
  if (text.length > 400) s += 5;
  if (/\d+%|\d+ years|\$\d+/i.test(text)) s += 7;
  return Math.min(Math.round(s), 99);
}

function renderAts(score) {
  const w = document.getElementById("atsWrap");
  w.style.display = "block";
  w.innerHTML = `<div class="ats-wrap">
    <div class="ats-label"><span>ATS Compatibility Score</span><span class="ats-val">${score}/99</span></div>
    <div class="ats-bar"><div class="ats-fill" id="atsF" style="width:0%"></div></div>
  </div>`;
  setTimeout(() => document.getElementById("atsF").style.width = score + "%", 80);
}

// ── Format resume text → HTML ─────────────────────────────────────────────────
function renderResume(text, fmt) {
  const lines = text.split("\n");
  let html = `<div class="fmt-${fmt}">`;
  let first = true;

  lines.forEach(line => {
    const t = line.trim();
    if (!t) { html += "<br>"; return; }

    if (/─{3,}/.test(t)) { html += `<hr class="r-divider">`; return; }

    if (/^[A-Z][A-Z\s]{3,}$/.test(t)) {
      html += `<div class="r-section">${t}</div>`; return;
    }

    if (first) {
      html += `<div class="r-name">${t}</div>`;
      first = false; return;
    }

    if (t.startsWith("•") || t.startsWith("-") || t.startsWith("*")) {
      html += `<div class="r-bullet">${t}</div>`; return;
    }

    html += `<div class="r-line">${t}</div>`;
  });

  html += "</div>";
  return html;
}

// ── Apply format to existing resume ──────────────────────────────────────────
function applyFormat() {
  if (!resume) return;
  document.getElementById("output").innerHTML = renderResume(resume, activeFmt);
}

// ── Generate ──────────────────────────────────────────────────────────────────
async function generate() {
  const nameEl = document.getElementById("name");
  const roleEl = document.getElementById("jobrole");
  let ok = true;
  [nameEl, roleEl].forEach(el => {
    if (!el.value.trim()) { el.classList.add("invalid"); ok = false; }
    else el.classList.remove("invalid");
  });
  if (!ok) { toast("Name and Job Role are required.", "error"); return; }

  const btn = document.getElementById("genBtn");
  const ldr = document.getElementById("btnLoader");
  const txt = document.getElementById("btnText");
  btn.disabled = true; ldr.style.display = "block"; txt.textContent = "Generating...";
  document.getElementById("atsWrap").style.display = "none";
  skeleton();

  try {
    const res = await fetch(`${API}/generate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name:       nameEl.value.trim(),
        jobrole:    roleEl.value.trim(),
        skills:     document.getElementById("skills").value.trim(),
        education:  document.getElementById("education").value.trim(),
        experience: document.getElementById("experience").value.trim(),
        tone:       activeTone,
      })
    });
    const data = await res.json();
    if (data.error) {
      document.getElementById("output").innerHTML = `<div style="color:#fca5a5;padding:1rem">${data.error}</div>`;
      toast(data.error, "error");
    } else {
      resume = data.result;
      document.getElementById("output").innerHTML = renderResume(resume, activeFmt);
      renderAts(atsScore(resume));
      ["improveBtn","copyBtn","dlBtn","dlTxtBtn"].forEach(id => document.getElementById(id).disabled = false);
      toast("Resume generated!", "success");
    }
  } catch(e) {
    document.getElementById("output").innerHTML = `<div style="color:#fca5a5;padding:1rem">Could not connect to server. Make sure it's running.</div>`;
    toast("Connection failed.", "error");
  } finally {
    btn.disabled = false; ldr.style.display = "none"; txt.textContent = "✨ Generate Resume";
  }
}

// ── Improve ───────────────────────────────────────────────────────────────────
async function improve() {
  if (!resume) return;
  const btn = document.getElementById("improveBtn");
  btn.disabled = true; btn.textContent = "Improving...";
  skeleton();
  try {
    const res = await fetch(`${API}/improve`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: resume, section: "full resume" })
    });
    const data = await res.json();
    if (data.error) { toast(data.error, "error"); }
    else {
      resume = data.result;
      document.getElementById("output").innerHTML = renderResume(resume, activeFmt);
      renderAts(atsScore(resume));
      toast("Resume improved!", "success");
    }
  } catch { toast("Improve failed.", "error"); }
  finally { btn.disabled = false; btn.textContent = "🪄 Improve"; }
}

// ── Copy ──────────────────────────────────────────────────────────────────────
async function copyText() {
  if (!resume) return;
  try {
    await navigator.clipboard.writeText(resume);
    const b = document.getElementById("copyBtn");
    b.textContent = "✓ Copied!"; b.classList.add("copied");
    setTimeout(() => { b.textContent = "Copy"; b.classList.remove("copied"); }, 2000);
    toast("Copied!", "success");
  } catch { toast("Copy failed.", "error"); }
}

// ── Download Plain Text (.txt) ────────────────────────────────────────────────
function downloadTxt() {
  if (!resume) return;
  const name = document.getElementById("name").value.trim() || "Resume";
  const blob = new Blob([resume], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${name.replace(/\s+/g, "_")}_resume.txt`;
  a.click();
  toast("Downloaded TXT resume!", "success");
}

// ── Download as PDF (desktop) / HTML (mobile) ─────────────────────────────────
function download() {
  if (!resume) return;
  const name = document.getElementById("name").value.trim() || "Resume";
  const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);

  const htmlContent = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${name} — Resume</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;font-size:11pt;color:#1e293b;background:#fff;padding:2cm;line-height:1.65}
    .r-name{font-family:'Outfit',sans-serif;font-size:22pt;font-weight:800;color:#4f46e5;margin-bottom:3pt}
    .r-role{font-size:11pt;color:#64748b;margin-bottom:14pt;font-weight:500}
    .r-section{font-size:8pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4f46e5;margin-top:14pt;margin-bottom:3pt}
    .r-divider{border:none;border-top:1.5px solid #e2e8f0;margin-bottom:8pt}
    .r-bullet{padding-left:14pt;margin-bottom:3pt;position:relative}
    .r-bullet::before{content:"•";position:absolute;left:4pt;color:#4f46e5}
    .r-line{margin-bottom:3pt}
    .print-btn{
      position:fixed;bottom:24px;right:24px;
      background:#4f46e5;color:#fff;border:none;
      padding:14px 24px;border-radius:12px;font-size:15px;
      font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(79,70,229,.4);
      font-family:'Inter',sans-serif;
    }
    .print-btn:hover{background:#4338ca}
    @media print{
      .print-btn{display:none}
      body{padding:1cm}
      @page{margin:1cm;size:A4}
    }
  </style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">🖨️ Save as PDF</button>
  ${renderResume(resume, "classic").replace(/class="fmt-classic"/g, '')}
</body>
</html>`;

  if (isMobile && navigator.share) {
    // Mobile: use Web Share API
    const blob = new Blob([htmlContent], { type: "text/html" });
    const file = new File([blob], `${name.replace(/\s+/g,"_")}_resume.html`, { type: "text/html" });
    navigator.share({ files: [file], title: `${name} — Resume` })
      .then(() => toast("Shared successfully!", "success"))
      .catch(() => fallbackDownload(htmlContent, name));
  } else if (isMobile) {
    fallbackDownload(htmlContent, name);
  } else {
    // Desktop: open print dialog
    const w = window.open("", "_blank");
    w.document.write(htmlContent);
    w.document.close();
    w.focus();
    setTimeout(() => { w.print(); }, 700);
    toast("Opening PDF export...", "success");
  }
}

function fallbackDownload(htmlContent, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([htmlContent], { type: "text/html" }));
  a.download = `${name.replace(/\s+/g,"_")}_resume.html`;
  a.click();
  toast("Downloaded! Open the file and tap Print → Save as PDF", "info");
}

// Clear invalid on type
["name","jobrole"].forEach(id =>
  document.getElementById(id).addEventListener("input", () =>
    document.getElementById(id).classList.remove("invalid")));
</script>
</body>
</html>
